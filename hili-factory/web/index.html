<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hili Realistic Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>
<div id="labels"></div>

<header id="topbar">
  <div class="brand">
    <img src="assets/logo-lodd.png" alt="LODD" class="logo lodd">
    <span class="sep"></span>
    <img src="assets/logo-hili.png" alt="Hili هيلي" class="logo hili">
  </div>
  <div class="title"><small data-i="kicker"></small><b data-i="title"></b></div>
  <div class="top-specs" id="specs"></div>
  <div class="top-actions">
    <button id="lang" class="chip" title="Language">AR</button>
  </div>
</header>

<section id="kpis">
  <div class="card kpi big">
    <svg viewBox="0 0 44 44" class="ring"><circle cx="22" cy="22" r="18" class="bg"/><circle cx="22" cy="22" r="18" class="fg" id="ringFg"/></svg>
    <div><small data-i="overall"></small><b id="kOverall">0%</b></div>
  </div>
  <div class="card kpi"><small data-i="elapsed"></small><b id="kElapsed">00:00</b></div>
  <div class="card kpi"><small data-i="remaining"></small><b id="kRemain">02:02</b></div>
  <div class="card kpi"><small data-i="parts"></small><b id="kParts">0 / 14</b></div>
  <div class="card kpi stagecard"><small data-i="stage"></small><b id="kStage">—</b></div>
</section>

<aside id="panel" class="card hidden">
  <button id="panelClose" aria-label="close">×</button>
  <div class="p-head"><span class="p-icon" id="pIcon">1</span><div><small id="pKind"></small><h2 id="pTitle"></h2></div></div>
  <div class="p-status" id="pStatus"></div>
  <div class="p-bar"><i id="pBar"></i></div>
  <p id="pDesc"></p>
  <ul id="pList"></ul>
  <div class="p-foot" id="pFoot"></div>
</aside>

<section id="tracker" class="card">
  <div class="steps" id="steps"></div>
  <div class="scrub"><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="timeline"></div>
  <div class="controls">
    <button id="play" class="btn primary" title="Space">❚❚</button>
    <button id="restart" class="btn" data-i-title="restart">↺</button>
    <div class="seg" id="speed"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
    <span class="gap"></span>
    <button id="tourBtn" class="tour" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.6"/></svg><span></span></button>
    <div class="seg" id="cams">
      <button data-c="overview" data-i="camOverview"></button>
      <button data-c="warehouse" data-i="camWarehouse"></button>
      <button data-c="line" data-i="camLine"></button>
      <button data-c="follow" data-i="camFollow"></button>
    </div>
  </div>
</section>

<div id="demo" class="chip ghost" data-i="demoNote"></div>
<div id="hint" class="chip ghost" data-i="hint"></div>
<div id="loading"><div class="spin"></div></div>

<script src="vendor/three.bundle.js"></script>
<script src="glb_data.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
